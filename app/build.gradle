plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    buildFeatures {
        viewBinding true
    }
    namespace "com.calculator.app"
    compileSdk 34
    buildToolsVersion "33.0.2"
    defaultConfig {
        applicationId "com.calculator.app"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
}
