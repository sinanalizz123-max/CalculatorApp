name: Android Ultra Fast (No Cache)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Clean Gradle + Android cache
        run: |
          rm -rf ~/.gradle
          rm -rf ~/.android
          rm -rf app/build
          rm -rf build

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build RELEASE APK (fresh, no cache)
        run: ./gradlew assembleRelease --no-daemon --no-build-cache --rerun-tasks

      - name: Upload RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorApp-Release
          path: app/build/outputs/apk/**/**/*.apk
